name: Terraform

# Esteira de infraestrutura em dois estágios:
#   plan  -> livre (PR ou dispatch), não altera nada e não gera custo
#   apply -> exige APROVAÇÃO no environment `aws-infra` antes de criar/destruir
#            recursos, evitando que um merge ou clique acidental gere gastos.
on:
  pull_request:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  push:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC: o job troca este token por credenciais AWS temporárias
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-infra-kubernetes
  TF_VAR_grafana_cloud_otlp_endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
  TF_VAR_grafana_cloud_instance_id: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
  TF_VAR_grafana_cloud_token: ${{ secrets.GRAFANA_CLOUD_TOKEN }}

jobs:
  plan:
    name: Plan (sem custo)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply / Destroy (requer aprovação)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action != 'plan')
    runs-on: ubuntu-latest
    # Gate de custo: o job fica em "Review deployments" até um revisor aprovar.
    environment: aws-infra
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Remove recursos órfãos do Ingress antes do destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        # ALB, target groups e security groups do Ingress são criados em runtime pelo
        # AWS Load Balancer Controller e ficam FORA do state do Terraform. Se sobrevivem
        # ao destroy, travam a exclusão da VPC. Removemos antes, de forma idempotente.
        run: |
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?starts_with(LoadBalancerName, 'k8s-oficinam')].LoadBalancerArn" \
            --output text)
          if [ -n "$ALB_ARN" ]; then
            echo "Removendo ALB orfao: $ALB_ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
            sleep 30
          fi
          for TG in $(aws elbv2 describe-target-groups \
            --query "TargetGroups[?starts_with(TargetGroupName, 'k8s-oficinam')].TargetGroupArn" --output text); do
            aws elbv2 delete-target-group --target-group-arn "$TG" || true
          done
          # Os security groups do controller tambem ficam fora do state e impedem a
          # exclusao da VPC (DependencyViolation), travando o destroy.
          VPC=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=oficina-mecanica-vpc --query 'Vpcs[0].VpcId' --output text)
          if [ "$VPC" != "None" ] && [ -n "$VPC" ]; then
            SGS=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values="$VPC" --query "SecurityGroups[?starts_with(GroupName, 'k8s-')].GroupId" --output text)
            for SG in $SGS; do
              echo "Removendo security group orfao: $SG"
              aws ec2 delete-security-group --group-id "$SG" || true
            done
          fi

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
