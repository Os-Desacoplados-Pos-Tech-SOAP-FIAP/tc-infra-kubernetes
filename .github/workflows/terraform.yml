name: Terraform

# Esteira de infraestrutura:
#   PR            -> fmt + validate + plan (resultado no summary do job)
#   merge na main -> apply automático (deploy contínuo)
#   botão Actions -> plan | apply | destroy sob demanda (workflow_dispatch)
on:
  pull_request:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  push:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC: o job troca este token por credenciais AWS temporárias
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-infra-kubernetes
  # Credenciais do Grafana Cloud (observabilidade). Vazias = recurso não criado.
  TF_VAR_grafana_cloud_otlp_endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
  TF_VAR_grafana_cloud_instance_id: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
  TF_VAR_grafana_cloud_token: ${{ secrets.GRAFANA_CLOUD_TOKEN }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        run: |
          terraform plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
