name: Terraform Gateway

# Stack do API Gateway — separada do cluster porque referencia o ALB, que só existe
# depois do deploy da aplicação. Apply é o ÚLTIMO da subida e o PRIMEIRO do destroy.
# Esteira em dois estágios:
#   plan  -> livre (PR ou dispatch), não altera nada e não gera custo
#   apply -> exige APROVAÇÃO no environment `aws-infra` antes de criar/destruir
#            recursos, evitando que um merge ou clique acidental gere gastos.
on:
  pull_request:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC: o job troca este token por credenciais AWS temporárias
  contents: read

concurrency:
  group: terraform-gateway-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-infra-kubernetes
  TF_VAR_grafana_cloud_otlp_endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
  TF_VAR_grafana_cloud_instance_id: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
  TF_VAR_grafana_cloud_token: ${{ secrets.GRAFANA_CLOUD_TOKEN }}

jobs:
  plan:
    name: Plan (sem custo)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=gateway fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=gateway init -input=false

      - name: Terraform validate
        run: terraform -chdir=gateway validate

      - name: Terraform plan
        run: |
          terraform -chdir=gateway plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply / Destroy (requer aprovação)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action != 'plan')
    runs-on: ubuntu-latest
    # Gate de custo: o job fica em "Review deployments" até um revisor aprovar.
    environment: aws-infra
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=gateway init -input=false

      - name: Terraform apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform -chdir=gateway apply -auto-approve -input=false

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform -chdir=gateway destroy -auto-approve -input=false
