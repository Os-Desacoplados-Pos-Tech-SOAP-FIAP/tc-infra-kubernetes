name: Terraform Gateway

# Stack do API Gateway — separada do cluster porque referencia o ALB, que só
# existe depois do deploy do app. Apply desta stack é o ÚLTIMO da ordem de subida.
on:
  pull_request:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/terraform-gateway.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-gateway-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-infra-kubernetes

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=gateway fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=gateway init -input=false

      - name: Terraform validate
        run: terraform -chdir=gateway validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        run: |
          terraform -chdir=gateway plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan (gateway)'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform -chdir=gateway apply -auto-approve -input=false

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform -chdir=gateway destroy -auto-approve -input=false
