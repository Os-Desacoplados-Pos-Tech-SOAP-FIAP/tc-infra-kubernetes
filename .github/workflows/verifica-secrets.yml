name: Verifica secrets

# TEMPORARIO - removido apos a verificacao. Imprime apenas o TAMANHO de cada
# segredo (nunca o valor) para confirmar que foram cadastrados com conteudo.
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verifica-secrets.yml']

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Tamanho dos segredos
        env:
          EP: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          TK: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          echo "OTLP_ENDPOINT: ${#EP} caracteres"
          echo "INSTANCE_ID:   ${#ID} caracteres"
          echo "TOKEN:         ${#TK} caracteres"
          echo "---"
          # Confere o formato sem revelar conteudo
          case "$EP" in https://otlp-gateway*) echo "endpoint: formato OK";; *) echo "endpoint: FORMATO INESPERADO";; esac
          case "$ID" in ''|*[!0-9]*) echo "instance id: FORMATO INESPERADO";; *) echo "instance id: formato OK (numerico)";; esac
          case "$TK" in glc_*) echo "token: formato OK";; *) echo "token: FORMATO INESPERADO";; esac
